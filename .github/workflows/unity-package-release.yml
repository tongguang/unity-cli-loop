name: unity-package-release
run-name: ${{ inputs.release-id || github.workflow }}

# Packs and verifies the complete UPM tree before publishing its immutable release.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Pack without creating the release (a published release is packed from its tag), and keep the tarball as a workflow artifact"
        type: boolean
        default: true
      expected-sha:
        description: Expected source commit supplied by Release
        type: string
      release-id:
        description: Correlation ID supplied by Release
        type: string

permissions:
  contents: read

jobs:
  plan:
    # Release dispatches this workflow after the native dependencies are published.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack: ${{ steps.plan.outputs.pack }}
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      asset-name: ${{ steps.plan.outputs.asset-name }}
      source-ref: ${{ steps.plan.outputs.source-ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify requested source commit
        env:
          EXPECTED_SHA: ${{ inputs.expected-sha }}
        run: test -z "$EXPECTED_SHA" || test "$EXPECTED_SHA" = "$GITHUB_SHA"

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: cli/.go-version
          cache-dependency-path: '**/go.sum'

      - name: Decide whether to pack and create the package release
        id: plan
        working-directory: cli/release-automation
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: go run ./cmd/plan-unity-package-release --repo "$GITHUB_REPOSITORY" --dry-run="$DRY_RUN" >> "$GITHUB_OUTPUT"

  # Packing uses the release source tree and needs no Editor or cloud credentials.
  pack:
    needs: plan
    if: needs.plan.outputs.pack == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout the package release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source-ref }}
          path: release-source
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: cli/.go-version
          cache-dependency-path: '**/go.sum'

      - name: Pack the Tuanjie package
        run: |
          mkdir -p "$RUNNER_TEMP/package-stage" "$RUNNER_TEMP/packed"
          cp -R release-source/Packages/src "$RUNNER_TEMP/package-stage/package"
          tar -czf "$RUNNER_TEMP/packed/package.tgz" -C "$RUNNER_TEMP/package-stage" package

      - name: Check and stage the package tarball
        id: stage
        working-directory: cli/release-automation
        env:
          PACKAGE_VERSION: ${{ needs.plan.outputs.version }}
        run: go run ./cmd/stage-unity-package --dir "$RUNNER_TEMP/packed" --version "$PACKAGE_VERSION" --source "$GITHUB_WORKSPACE/release-source/Packages/src" >> "$GITHUB_OUTPUT"

      - name: List the package tarball contents
        env:
          ARCHIVE: ${{ steps.stage.outputs.archive }}
        run: tar -tzvf "$ARCHIVE"

      - name: Upload the package tarball as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tloop-upm-package
          path: ${{ steps.stage.outputs.archive }}
          if-no-files-found: error
          retention-days: 14

  # Creates the tag at the release commit, then creates and publishes the
  # release with the package tarball in one step. The plan's readiness checks are
  # not repeated: what they verified (the release commit's protocol and pin, the
  # published runner and dispatcher releases) cannot change any more, and the
  # tag and the release, which can, are checked again right before the writes.
  publish:
    needs: [plan, pack]
    # Only main may publish a release.
    if: needs.plan.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    # Creations run one at a time, so two runs never create the same release.
    # Only this job is serialized: a run that skips, a dry run, or a run after a
    # cancelled one never gets here, so it cannot take the place of a waiting
    # creation. A waiting creation may be replaced by a newer one, which creates
    # the same release, or finds it published and does nothing.
    concurrency:
      group: unity-package-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The release notes are read from the changelog at the release commit.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: cli/.go-version
          cache-dependency-path: '**/go.sum'

      - name: Download the package tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: tloop-upm-package
          path: ${{ runner.temp }}/packed

      - name: Create the release with the package tarball
        working-directory: cli/release-automation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.source-ref }}
          ASSET_NAME: ${{ needs.plan.outputs.asset-name }}
        run: >-
          go run ./cmd/create-unity-package-release
          --repo "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG"
          --commit "$RELEASE_COMMIT"
          --asset "$RUNNER_TEMP/packed/$ASSET_NAME"
