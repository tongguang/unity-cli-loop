name: C# Unit Tests

# Release automation dispatches this workflow by file name, so the file keeps
# its inherited name. It runs only the Unity-free .NET unit test projects and
# never starts a Unity or Tuanjie Editor.
#
# The workflow always runs, and a change-detection step decides whether to run
# the tests or report success immediately, so every pull request gets exactly
# one result from it.
on:
  pull_request:
    branches: [ main, v3-beta ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: C# Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Full history is required so the change-detection step can diff the
          # PR head against its base.
          fetch-depth: 0

      - name: Detect C# changes
        id: changes
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # workflow_dispatch has no PR context, so run the tests.
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "csharp=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "=== Changed files ==="
          echo "$CHANGED"

          # Must cover every file the test projects compile in through their
          # Compile Include items.
          if echo "$CHANGED" | grep -qE '^(Packages/src/.*\.cs|cli/dispatcher/internal/compilecheck/fastcheck/worker/.*\.cs|tests/.*|\.github/workflows/unity-compile-check-and-test-runner\.yml)$'; then
            echo "csharp=true" >> "$GITHUB_OUTPUT"
          else
            echo "csharp=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice
        if: steps.changes.outputs.csharp != 'true'
        run: echo "No C# changes the unit tests cover; reporting success without running them."

      - name: Setup .NET
        if: steps.changes.outputs.csharp == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Run concurrency unit tests
        if: steps.changes.outputs.csharp == 'true'
        run: |
          dotnet test tests/DynamicCodeExecutionScheduler.UnitTests/DynamicCodeExecutionScheduler.UnitTests.csproj --configuration Release
          dotnet test tests/SharedRoslynCompilerWorker.UnitTests/SharedRoslynCompilerWorker.UnitTests.csproj --configuration Release
          dotnet test tests/OutputFileRetention.UnitTests/OutputFileRetention.UnitTests.csproj --configuration Release
          dotnet test tests/RunTestsExecutionTimeout.UnitTests/RunTestsExecutionTimeout.UnitTests.csproj --configuration Release
          dotnet test tests/CompileCheckWorker.UnitTests/CompileCheckWorker.UnitTests.csproj --configuration Release
